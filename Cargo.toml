[package]
name = "vpsadmin-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Typed async and blocking client for vpsAdmin API 7.0"
repository = "https://github.com/vpsfreecz/vpsadmin-rust-client"
readme = "README.md"
keywords = ["vpsadmin", "vpsfree", "haveapi", "api", "client"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md"]

[features]
default = []
blocking = ["reqwest/blocking"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "blocking_vps"
required-features = ["blocking"]
