name: Rust client

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [async, blocking]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@v31.11.3
      - name: Check formatting
        run: |
          nix develop --command cargo fmt --all -- --check
          nix develop --command tools/check-provenance
      - name: Test client and examples
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = blocking ]; then
            nix develop --command cargo test --locked --all-targets --features blocking
          else
            nix develop --command cargo test --locked --all-targets
          fi
      - name: Check documentation and package
        if: matrix.mode == 'blocking'
        run: |
          nix develop --command cargo doc --locked --all-features --no-deps
          nix develop --command cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@v31.11.3
      - name: Check Rust 1.95 with the committed dependency lock
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup_bin=$(command -v rustup)
          nix develop --command "$rustup_bin" run 1.95.0 cargo test --locked --all-targets
          nix develop --command "$rustup_bin" run 1.95.0 cargo test --locked --all-targets --features blocking

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@v31.11.3
      - name: Read recorded generator revision
        id: generator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          revision = json.load(open('schema/provenance.json'))['generator']['revision']
          assert len(revision) == 40 and all(c in '0123456789abcdef' for c in revision)
          print(f'revision={revision}')
          PY
      - uses: actions/checkout@v7.0.1
        with:
          repository: vpsfreecz/haveapi
          ref: ${{ steps.generator.outputs.revision }}
          path: .haveapi-generator
      - name: Install generator dependencies and check saved source
        run: |
          nix develop --command bash -euo pipefail <<'SH'
          tools/check-provenance
          export HAVEAPI_SOURCE="$GITHUB_WORKSPACE/.haveapi-generator"
          revision=$(python3 -c 'import json; print(json.load(open("schema/provenance.json"))["generator"]["revision"])')
          test "$(git -C "$HAVEAPI_SOURCE" rev-parse HEAD)" = "$revision"
          lock="$HAVEAPI_SOURCE/clients/rust/Gemfile.lock"
          test ! -L "$lock"
          if [ -e "$lock" ]; then
            cmp schema/generator.Gemfile.lock "$lock"
          else
            cp schema/generator.Gemfile.lock "$lock"
          fi
          export GEM_HOME="$RUNNER_TEMP/rust-generator-gems"
          export GEM_PATH="$GEM_HOME:$(ruby -e 'puts Gem.default_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          export BUNDLE_GEMFILE="$HAVEAPI_SOURCE/clients/rust/Gemfile"
          export BUNDLE_PATH="$RUNNER_TEMP/rust-generator-bundle"
          export BUNDLE_USER_HOME="$RUNNER_TEMP/rust-bundler-user"
          export BUNDLE_APP_CONFIG="$RUNNER_TEMP/rust-bundler-config"
          export BUNDLE_FROZEN=true
          gem install --no-document bundler --version 4.0.23
          bundle install
          bundle check
          cmp schema/generator.Gemfile.lock "$lock"
          python3 -B tools/test-regenerate.py
          tools/regenerate --check
          cmp schema/generator.Gemfile.lock "$lock"
          SH
